# SPDX-License-Identifier: LGPL-2.1-or-later

[Config]
MinimumVersion=26~devel

[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64

[Build]
ToolsTree=default
ToolsTreeProfiles=misc,runtime
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Output]
OutputDirectory=mkosi.output
SplitArtifacts=uki,partitions,roothash,os-release,repart-definitions
Format=disk
ImageId=ParticleOS-Host
ManifestFormat=json
Output=%i_%v_%a
CompressOutput=zstd

[Content]
Bootable=yes
WithDocs=no
WithRecommends=no
SELinuxRelabel=yes
ExtraTrees=%D/mkosi.resources:/usr/lib/particleos/build-resources
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
        root=dissect
        rootflags=nosuid,nodev,noexec
        mount.usr=dissect
        mount.usrflags=ro,nodev,nosuid
        rw
        systemd.firstboot=headless
        systemd.credentials_boot_policy=strict
        rd.systemd.mask=systemd-tpm2-setup-early.service
        audit=1
        audit_backlog_limit=8192
        enforcing=1
        selinux=1
        systemd.verity_usr_options=root-hash-signature=auto
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=absent:=ignore
        systemd.image_filter=usr=ParticleOS-Host_*:usr-verity=ParticleOS-Host_*:usr-verity-sig=ParticleOS-Host_*:root=ParticleOS-Host-root
        ipe.enforce=1
        slab_nomerge
        init_on_alloc=1
        init_on_free=1
        page_alloc.shuffle=1
        randomize_kstack_offset=on
        module.sig_enforce=1
        rd.shell=0
        rd.emergency=halt
        lockdown=confidentiality
        vsyscall=none
        ia32_emulation=0
        fb_tunnels=none
        noautogroup
InitrdProfiles=
KernelInitrdModules=default,-binfmt_misc
Hostname=particle-host-????-????

Packages=
        authselect
        bash
        btrfs-progs
        ca-certificates
        chrony
        container-selinux
        containers-common
        coreutils
        cryptsetup
        dbus-broker
        dosfstools
        e2fsprogs
        fedora-release
        findutils
        gnupg2
        hardened_malloc
        iproute
        kernel-core
        kernel-modules-core
        kmod
        libcurl-minimal
        nftables
        no_rlimit_as
        openssh-server
        openssl
        pam
        podman
        policycoreutils
        polkit
        procps-ng
        runsc
        sbsigntools
        sed
        selinux-policy-targeted
        shadow-utils
        systemd
        systemd-boot
        systemd-container
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        tpm2-tools
        tpm2-tss
        udev
        util-linux
        veritysetup
        zstd

InitrdPackages=
        btrfs-progs
        dosfstools
        e2fsprogs
        ipe-policy-containerhost
        libfdisk

VolatilePackages=
        systemd
        systemd-boot
        systemd-container
        systemd-networkd
        systemd-networkd-defaults
        systemd-oomd-defaults
        systemd-pam
        systemd-resolved
        udev

InitrdVolatilePackages=
        systemd
        udev

RemoveFiles=
        /etc/gnupg
        /etc/profile.d/gnupg2.csh
        /etc/profile.d/gnupg2.sh
        /usr/lib/nvpcr
        /usr/bin/crun
        /usr/bin/importctl
        /usr/bin/machinectl
        /usr/bin/newgidmap
        /usr/bin/newuidmap
        /usr/bin/pasta
        /usr/bin/passt
        /usr/bin/podman-remote
        /usr/bin/slirp4netns
        /usr/bin/systemd-nspawn
        /usr/lib/particleos/build-resources
        /usr/lib/systemd/system-generators/systemd-import-generator
        /usr/lib/systemd/system/dbus-org.freedesktop.import1.service
        /usr/lib/systemd/system/dbus-org.freedesktop.machine1.service
        /usr/lib/systemd/system/systemd-importd.service
        /usr/lib/systemd/system/systemd-importd.socket
        /usr/lib/systemd/system/systemd-machined.service
        /usr/lib/systemd/system/systemd-machined.socket
        /usr/lib/systemd/system/systemd-nspawn@.service
        /usr/lib/systemd/user-generators/podman-system-generator
        /usr/lib/systemd/user/podman-auto-update.service
        /usr/lib/systemd/user/podman-auto-update.timer
        /usr/lib/systemd/user/podman-restart.service
        /usr/lib/systemd/user/podman.service
        /usr/lib/systemd/user/podman.socket
        /var/lib/machines

[Validation]
SecureBoot=yes
SignExpectedPcr=no

[Runtime]
RuntimeSize=16G
RAM=4G
CPUs=4
Ephemeral=yes
Credentials=
        passwd.plaintext-password.root=particleos

[Include]
Include=%D/mkosi.obs.conf
