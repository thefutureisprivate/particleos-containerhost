[Unit]
# Root recovery and timezone setup must finish before the administrator prompt.
ConditionFirstBoot=
Requires=systemd-firstboot.service
Requires=particleos-pcrlock-enroll.service
After=systemd-firstboot.service particleos-pcrlock-enroll.service

[Service]
# Continue the native account wizard on the same primary VGA terminal used by
# systemd-firstboot, including after the PCR-policy enrollment reboot.
TTYPath=/dev/tty1
# Use systemd's native username/password wizard, but make the sole human user
# an authenticated run0 administrator and bound its encrypted home so it cannot
# consume container state. The backing file already inherits PCR 7+11 rollback
# protection from the encrypted persistent root.
ExecStart=
ExecStart=/usr/bin/homectl firstboot --prompt-new-user --prompt-shell=no --prompt-groups=no --mute-console=yes --member-of=wheel,systemd-journal --storage=luks --fs-type=btrfs --disk-size=1G --auto-resize-mode=off --luks-discard=yes --nosuid=yes --nodev=yes --noexec=yes
