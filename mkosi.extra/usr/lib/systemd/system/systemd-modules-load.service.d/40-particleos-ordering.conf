[Unit]
# The immutable module set is read from the verity-backed /usr. Complete the
# root remount first, then load it before other root-side sysinit work can
# request overlapping modules or inspect changing device state.
After=systemd-remount-fs.service
Before=systemd-network-generator.service systemd-pcrmachine.service systemd-udev-load-credentials.service systemd-udev-trigger.service
