[Unit]
# Re-run the idempotent checks after an interrupted initial boot.
ConditionFirstBoot=

[Service]
# Keep the requested console sequence deterministic: configure the distinct
# recovery root password first, then the local timezone. Locale, keymap, and
# hostname retain the image defaults.
ExecStart=
ExecStart=/usr/bin/systemd-firstboot --prompt-root-password --mute-console=yes
ExecStart=/usr/bin/systemd-firstboot --prompt-timezone --mute-console=yes
