[Service]
# Label the filesystem root while homed mounts it in its private staging path,
# before PAM can enter the home.
Environment=SYSTEMD_HOME_MOUNT_OPTIONS_BTRFS=compress=zstd:1,noacl,user_subvol_rm_allowed,defcontext=system_u:object_r:user_home_t:s0,rootcontext=system_u:object_r:user_home_dir_t:s0
