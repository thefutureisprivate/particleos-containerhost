[Service]
# homed creates fresh Btrfs filesystems without SELinux xattrs. Supply the
# standard user-home content type as the fallback before PAM enters the home.
Environment=SYSTEMD_HOME_MOUNT_OPTIONS_BTRFS=compress=zstd:1,noacl,user_subvol_rm_allowed,defcontext=system_u:object_r:user_home_t:s0
