[Unit]
Requires=nftables.service particleos-module-lockdown.service
After=nftables.service particleos-module-lockdown.service

[Service]
# Keep the unit active until every authenticated transfer and the exact
# candidate UKI authorization have committed.
Type=oneshot
TimeoutStartSec=infinity
NFTSet=cgroup:inet:particleos_filter:sysupdate_cgroups
ExecStart=
ExecStart=/usr/lib/particleos/sysupdate
