[Unit]
Requires=nftables.service particleos-module-lockdown.service
After=nftables.service particleos-module-lockdown.service

[Service]
# Upstream uses Type=simple, which would run ExecStartPost as soon as the
# updater process is spawned. Keep the unit active until every transfer has
# committed so PCR authorization cannot race candidate UKI installation.
Type=oneshot
TimeoutStartSec=infinity
NFTSet=cgroup:inet:particleos_filter:sysupdate_cgroups
ExecStartPost=/usr/lib/particleos/pcrlock-refresh all
