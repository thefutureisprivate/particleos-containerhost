# All mutable host and container state lives here. systemd-repart uses PCR 7
# only as a one-boot bootstrap enrollment. Before boot blessing, ParticleOS
# atomically replaces it with an NV-backed pcrlock policy covering PCR 7+11.
[Partition]
Type=root
Format=btrfs
SizeMinBytes=4G
Weight=20000
Subvolumes=/var
CopyFiles=/usr/share/factory/root:/
Encrypt=tpm2
TPM2PCRs=7
FactoryReset=yes
Label=%M-root
