# All mutable host and container state lives here. PCR 7 binds the LUKS token
# to Secure Boot policy without tying it to a specific A/B OS version.
[Partition]
Type=root
Format=btrfs
SizeMinBytes=4G
Weight=20000
Subvolumes=/var
CopyFiles=/usr/share/factory/root:/
Encrypt=tpm2
TPM2PCRs=7
FactoryReset=yes
Label=%M-root
