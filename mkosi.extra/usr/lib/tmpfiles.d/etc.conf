L /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab - - - - ../proc/self/mounts
L /etc/locale.conf
L /etc/nsswitch.conf
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
L /etc/profile
L /etc/profile.d
L /etc/security
L? /etc/bashrc
L? /etc/bash.bashrc
L? /etc/bash.bash_logout
L? /etc/ca-certificates
L? /etc/containers
L? /etc/crypto-policies
L? /etc/pki
L /etc/ssh/ssh_config
L /etc/ssh/ssh_config.d
L /etc/ssh/sshd_config
L /etc/ssh/sshd_config.d
L /etc/ssl
L /etc/environment
L /etc/ld.so.preload
L? /etc/authselect
L? /etc/protocols
L? /etc/services
L? /etc/selinux
L? /etc/chrony.conf
L? /etc/sysconfig/chronyd
L /etc/subuid
L /etc/subgid

d /var/lib/containers 0700 root root -
d /var/lib/containers/storage 0700 root root -
