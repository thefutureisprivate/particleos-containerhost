#!/usr/bin/nft -f

destroy table inet particleos_filter

table inet particleos_filter {
    set sysupdate_cgroups {
        type cgroupsv2
        size 4
    }

    # Provisioning adds exact bridge/destination/transport tuples to these
    # sets. Empty sets are intentional: new workloads have no forwarding.
    set workload_egress_tcp4 {
        type ifname . ipv4_addr . inet_service
    }

    set workload_egress_udp4 {
        type ifname . ipv4_addr . inet_service
    }

    set workload_egress_tcp6 {
        type ifname . ipv6_addr . inet_service
    }

    set workload_egress_udp6 {
        type ifname . ipv6_addr . inet_service
    }

    set workload_ingress_tcp4 {
        type ifname . ipv4_addr . inet_service
    }

    set workload_ingress_udp4 {
        type ifname . ipv4_addr . inet_service
    }

    set workload_ingress_tcp6 {
        type ifname . ipv6_addr . inet_service
    }

    set workload_ingress_udp6 {
        type ifname . ipv6_addr . inet_service
    }

    chain prerouting_raw {
        type filter hook prerouting priority raw; policy accept;

        ip6 saddr :: meta l4proto ipv6-icmp notrack accept
        fib saddr . iif oif missing counter drop
        # Workload forwarding is decided only by the exact tuples in the
        # filter hook. Do not let the host-destination anti-spoof check make
        # those allowlists unreachable; source reverse-path validation above
        # still applies to every Podman bridge.
        iifname "podman*" return
        iifname "lo" notrack accept
        fib daddr . iif type != { local, broadcast, multicast } counter drop
        ip protocol icmp notrack accept
        meta l4proto ipv6-icmp notrack accept
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid counter drop
        iifname "lo" accept
        ct state { established, related } accept

        meta nfproto ipv4 udp sport 67 udp dport 68 accept
        meta nfproto ipv6 udp sport 547 udp dport 546 accept
        ip protocol icmp limit rate 100/second burst 200 packets accept
        meta l4proto ipv6-icmp limit rate 100/second burst 200 packets accept

        # Workloads receive no recursive DNS path through the host. Operators
        # provision fixed addresses or application-level discovery instead.
        iifname "podman*" udp dport 53 counter reject
        iifname "podman*" tcp dport 53 counter reject with tcp reset

        tcp flags & (fin | syn | rst | ack) != syn ct state new counter drop
        meta nfproto ipv4 tcp dport 22 ct state new meter ssh4 size 65535 { ip saddr timeout 5m limit rate over 4/minute burst 4 packets } counter drop
        meta nfproto ipv6 tcp dport 22 ct state new meter ssh6 size 65535 { ip6 saddr timeout 5m limit rate over 4/minute burst 4 packets } counter drop
        tcp dport 22 ct state new accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid counter drop
        ct state { established, related } accept
        iifname "podman*" udp dport 53 counter reject
        iifname "podman*" tcp dport 53 counter reject with tcp reset
        iifname . ip daddr . tcp dport @workload_egress_tcp4 accept
        iifname . ip daddr . udp dport @workload_egress_udp4 accept
        iifname . ip6 daddr . tcp dport @workload_egress_tcp6 accept
        iifname . ip6 daddr . udp dport @workload_egress_udp6 accept
        oifname . ip daddr . tcp dport @workload_ingress_tcp4 ct status dnat accept
        oifname . ip daddr . udp dport @workload_ingress_udp4 ct status dnat accept
        oifname . ip6 daddr . tcp dport @workload_ingress_tcp6 ct status dnat accept
        oifname . ip6 daddr . udp dport @workload_ingress_udp6 ct status dnat accept
        counter reject
    }

    chain output {
        type filter hook output priority filter; policy drop;

        oifname "lo" accept
        ct state invalid counter drop
        ct state { established, related } accept
        ip protocol icmp accept
        meta l4proto ipv6-icmp accept

        meta skuid systemd-network udp dport { 67, 547 } accept
        meta skuid systemd-resolve ip daddr { 1.1.1.1, 1.0.0.1 } tcp dport 853 accept
        meta skuid systemd-resolve ip6 daddr { 2606:4700:4700::1111, 2606:4700:4700::1001 } tcp dport 853 accept
        meta skuid chrony udp dport 123 accept
        meta skuid chrony tcp dport 4460 accept
        socket cgroupv2 level 2 @sysupdate_cgroups tcp dport 443 ct state new limit rate 16/second burst 32 packets accept

        # Rootful Podman may pull only from conventional TLS registry ports.
        # Signature policy is enforced independently before image acceptance.
        meta skuid root tcp dport { 443, 8443 } ct state new accept

        meta l4proto tcp reject with tcp reset
        meta l4proto udp reject
        reject
    }
}

# Root-owned site policy may populate only the named sets, for example:
# add element inet particleos_filter workload_egress_tcp4 { "podman0" . 192.0.2.10 . 443 }
include "/etc/particleos/nftables.d/*.nft"
