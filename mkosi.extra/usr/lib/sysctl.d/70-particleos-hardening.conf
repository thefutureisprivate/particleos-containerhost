# Systrap attaches only to executor children created by gvisor_t.
# Mode 2 still requires CAP_SYS_PTRACE; SELinux further limits ptrace to the
# runtime's own domain while deny_ptrace remains enabled globally.
kernel.yama.ptrace_scope = 2
kernel.randomize_va_space = 2
vm.mmap_min_addr = 65536
vm.mmap_rnd_bits = 32
vm.memfd_noexec = 1
vm.unprivileged_userfaultfd = 0

kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3
kernel.sysrq = 0
kernel.kexec_load_disabled = 1
kernel.unprivileged_bpf_disabled = 2
net.core.bpf_jit_harden = 2
kernel.io_uring_disabled = 2
-net.netfilter.nf_conntrack_max = 262144

# SELinux limits this quota to init/update helpers and gvisor_t.
user.max_user_namespaces = 64
-kernel.unprivileged_userns_clone = 0

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

kernel.core_uses_pid = 1
kernel.core_pattern = |/bin/false
kernel.panic = -1
kernel.panic_on_oops = 1
kernel.oops_limit = 100
kernel.warn_limit = 100
kernel.printk = 3 3 3 3
dev.tty.ldisc_autoload = 0
