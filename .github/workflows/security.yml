name: security-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes python3 ripgrep shellcheck
      - name: Enforce security policy and hostile-input regressions
        run: ./scripts/validate.sh
