# OBS exposes its project certificate only to recipes carrying
# # needssslcertforbuild. The upstream mkosi-obs two-pass flow remains the
# authoritative Secure Boot and dm-verity signer.
[Match]
PathExists=/usr/src/packages/SOURCES/_projectcert.crt

[Include]
Include=mkosi-obs

[Output]
# mkosi-obs requests expected-PCR artifacts by default. The OBS project key is
# RSA-4096, which firmware can verify but common TPMs cannot load as an
# external PCR-policy key. Keep state sealing portable and deliberately bound
# only to PCR 7 by suppressing the optional PCR11 policy artifacts.
SplitArtifacts=
SplitArtifacts=uki,partitions,roothash,os-release,repart-definitions

[Content]
ExtraTrees=%D/mkosi.obs.extra
PostInstallationScripts=%D/mkosi.scripts/install-obs-project-certificate
PostOutputScripts=
PostOutputScripts=%D/mkosi.scripts/obs-postoutput
