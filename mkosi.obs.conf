# OBS exposes its project certificate only to recipes carrying
# # needssslcertforbuild. The upstream mkosi-obs two-pass flow remains the
# authoritative Secure Boot and dm-verity signer.
[Match]
PathExists=/usr/src/packages/SOURCES/_projectcert.crt

[Include]
Include=mkosi-obs

[Content]
ExtraTrees=%D/mkosi.obs.extra
PostInstallationScripts=%D/mkosi.scripts/install-obs-project-certificate
PostOutputScripts=
PostOutputScripts=%D/mkosi.scripts/obs-postoutput
