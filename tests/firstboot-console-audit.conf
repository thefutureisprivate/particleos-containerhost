[Unit]
Description=ParticleOS native first-boot and run0 audit
ConditionPathExists=
ConditionPathExists=!/etc/initrd-release
Requires=systemd-homed-firstboot.service
After=systemd-homed-firstboot.service systemd-user-sessions.service
SuccessAction=poweroff
FailureAction=poweroff

[Service]
Type=oneshot
Restart=no
ExecStart=
LoadCredential=firstboot-console-audit
ExecStart=/usr/bin/bash %d/firstboot-console-audit
ExecStart=/usr/sbin/agetty --noreset --noclear --keep-baud 115200,57600,38400,9600 - vt220
StandardInput=tty-force
StandardOutput=tty
StandardError=tty
TTYPath=/dev/ttyS0
TTYReset=yes
TTYVHangup=yes
TimeoutStartSec=5min
