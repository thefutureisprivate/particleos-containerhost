[Unit]
Description=ParticleOS A/B update and rollback audit
ConditionPathExists=
ConditionPathExists=!/etc/initrd-release
Requires=particleos-pcrlock-enroll.service
Wants=particleos-pcrlock-prune.service
After=particleos-pcrlock-enroll.service systemd-bless-boot.service particleos-pcrlock-prune.service nftables.service
SuccessAction=poweroff
FailureAction=poweroff

[Service]
Type=oneshot
Restart=no
ExecStart=
LoadCredential=update-rollback-audit
LoadCredential=update-audit-scenario
LoadCredential=update-audit-base-version
LoadCredential=update-audit-candidate-version
ExecStart=/usr/bin/bash %d/update-rollback-audit
StandardInput=null
StandardOutput=tty
StandardError=tty
TTYPath=/dev/ttyS0
TimeoutStartSec=15min
