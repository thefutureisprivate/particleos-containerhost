# Run the completion half of the audit only after the production pruning
# command has committed the blessed (or fallback) policy. Keeping this out of
# getty@tty1 avoids a getty -> bless -> boot-complete -> multi-user ordering
# cycle while still exercising the unmodified production ExecStart.
[Service]
LoadCredential=update-rollback-audit
LoadCredential=update-audit-scenario
LoadCredential=update-audit-base-version
LoadCredential=update-audit-candidate-version
ExecStartPost=/usr/bin/bash %d/update-rollback-audit
StandardOutput=tty
StandardError=tty
TTYPath=/dev/ttyS0
