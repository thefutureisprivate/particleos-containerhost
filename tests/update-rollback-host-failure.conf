# Inject a host-side pre-blessing failure only for the dedicated fallback
# scenario. The production optional-health check and PCR commit remain intact.
[Service]
LoadCredential=update-rollback-host-failure
LoadCredential=update-audit-scenario
LoadCredential=update-audit-candidate-version
ExecStartPre=/usr/bin/bash %d/update-rollback-host-failure
