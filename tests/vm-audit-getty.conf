[Unit]
Description=ParticleOS local VM security audit
ConditionPathExists=
ConditionPathExists=!/etc/initrd-release
Requires=particleos-pcrlock-enroll.service systemd-homed-firstboot.service particleos-network-security.target
After=particleos-pcrlock-enroll.service systemd-homed-firstboot.service particleos-network-security.target systemd-user-sessions.service
SuccessAction=poweroff
FailureAction=poweroff

[Service]
Type=oneshot
Restart=no
ExecStart=
LoadCredential=vm-audit
ExecStart=/usr/bin/bash %d/vm-audit
StandardInput=null
StandardOutput=tty
StandardError=tty
TTYPath=/dev/ttyS0
TimeoutStartSec=3min
