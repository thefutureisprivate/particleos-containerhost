[Unit]
Description=ParticleOS fail-closed network startup canary
ConditionPathExists=
ConditionPathExists=!/etc/initrd-release
Requires=particleos-network-security.target
After=particleos-network-security.target
SuccessAction=poweroff

[Service]
Type=oneshot
ExecStart=
ExecStart=/usr/bin/echo PARTICLEOS_NETWORK_SECURITY_FAIL_OPEN
StandardOutput=tty
StandardError=tty
TTYPath=/dev/ttyS0
