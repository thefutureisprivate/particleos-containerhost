# Replace only the health probe. The production unit retains its counted-boot
# condition, reboot-on-failure behavior, and [Install] relationship to blessing,
# so the audit exercises the real administrator opt-in path.
[Service]
LoadCredential=update-rollback-health
LoadCredential=update-audit-scenario
LoadCredential=update-audit-base-version
ExecStart=
ExecStart=/usr/bin/bash %d/update-rollback-health
StandardOutput=tty
StandardError=tty
TTYPath=/dev/ttyS0
